# Tiny Tapeout project information
project:
  title:        "Deterministe 3x3 - Strict Logic"
  author:       "Marius LEPERE"
  discord:      "carjaguar"
  description:  "Strict boolean logic (If/Else) for 3x3 shape detection. Educational baseline to compare against hardware NPU."
  language:     "Verilog"
  clock_hz:     0       # Design purement combinatoire

  # How many tiles your design occupies?
  tiles: "1x1"

  # Your top module name must start with "tt_um_":
  top_module:  "tt_um_deterministe_MariusL00"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs : Les 8 premiers pixels de la matrice 3x3
  ui[0]: "Pixel 0"
  ui[1]: "Pixel 1"
  ui[2]: "Pixel 2"
  ui[3]: "Pixel 3"
  ui[4]: "Pixel 4"
  ui[5]: "Pixel 5"
  ui[6]: "Pixel 6"
  ui[7]: "Pixel 7"

  # Outputs : ID de la prédiction (3 bits) + État brut des 5 portes logiques
  uo[0]: "Prediction ID [Bit 0 / LSB]"
  uo[1]: "Prediction ID [Bit 1]"
  uo[2]: "Prediction ID [Bit 2 / MSB]"
  uo[3]: "Logic Gate: is_h (Horizontal)"
  uo[4]: "Logic Gate: is_v (Vertical)"
  uo[5]: "Logic Gate: is_d1 (Diagonale 1)"
  uo[6]: "Logic Gate: is_d2 (Diagonale 2)"
  uo[7]: "Logic Gate: no_match (Rejeté)"

  # Bidirectional pins : Utilisées ici comme ENTRÉES
  uio[0]: "Pixel 8 (Le 9ème pixel de la matrice)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6